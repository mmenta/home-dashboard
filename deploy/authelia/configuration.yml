# Authelia for *.experimenta.cc. Served at the root of auth.experimenta.cc (SWAG.s
# snippets expect that path). Only the trading dashboards are gated; the other
# apps carry their own login. Secrets are filled in at bootstrap.
theme: dark

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

totp:
  issuer: experimenta.cc

identity_validation:
  reset_password:
    jwt_secret: REPLACE_WITH_RANDOM_HEX64

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain:
        - kalshi.experimenta.cc
        - polyview.experimenta.cc
        - crossarb.experimenta.cc
        - weather.experimenta.cc
      policy: two_factor

session:
  secret: REPLACE_WITH_RANDOM_HEX64
  cookies:
    - name: authelia_session
      domain: experimenta.cc
      authelia_url: https://auth.experimenta.cc
      default_redirection_url: https://experimenta.cc
      expiration: 12h
      inactivity: 1h

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: REPLACE_WITH_RANDOM_HEX64
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

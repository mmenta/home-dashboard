# Catch-all: plain HTTP goes to HTTPS; an unknown subdomain gets the connection
# dropped (444) so scanners learn nothing from the wildcard.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include /config/nginx/ssl.conf;
    return 444;
}

# Edge stack for *.experimenta.cc: SWAG (TLS + reverse proxy), Authelia (login
# wall for the trading dashboards), cloudflare-ddns (keeps home.experimenta.cc on
# the WAN IP; every other name is a wildcard CNAME to it). One wildcard cert via
# Cloudflare dns-01 — adding a site is a site-conf + nginx reload, nothing else.
services:
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add: [NET_ADMIN]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - URL=experimenta.cc
      - SUBDOMAINS=wildcard
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - ONLY_SUBDOMAINS=false
    volumes:
      - ./swag:/config
    ports:
      - "80:80"
      - "443:443"
    networks: [proxy]
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    volumes:
      - ./authelia:/config
    environment:
      - TZ=America/Los_Angeles
    networks: [proxy]
    restart: unless-stopped

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    environment:
      - CLOUDFLARE_API_TOKEN_FILE=/run/secrets/cf-token
      - DOMAINS=home.experimenta.cc
      - PROXIED=false
      - IP6_PROVIDER=none
      - TZ=America/Los_Angeles
    volumes:
      - ./swag/dns-conf/cf-token:/run/secrets/cf-token:ro
    restart: unless-stopped

networks:
  proxy:
    external: true

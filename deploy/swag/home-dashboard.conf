# Place at: swag/nginx/site-confs/home-dashboard.conf  (i.e. /config/nginx/site-confs/ inside SWAG)
# Remove or rename the default site conf so this one handles the domain.
#
# This uses SWAG's bundled Authelia snippets (authelia-server.conf /
# authelia-location.conf), which linuxserver keeps in sync with Authelia's API.
# They are shipped in /config/nginx/ — if missing, grab them from the SWAG repo.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOURNAME.*;

    include /config/nginx/ssl.conf;

    # Authelia login portal, served under /authelia
    location ^~ /authelia {
        include /config/nginx/proxy.conf;
        proxy_pass http://authelia:9091;
    }
    include /config/nginx/authelia-server.conf;

    # Everything else requires a valid Authelia session, then proxies to the app.
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/authelia-location.conf;

        set $upstream_app home-dashboard;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOURNAME.*;
    return 301 https://$host$request_uri;
}

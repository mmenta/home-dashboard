# Authelia config. Replace YOURNAME and the three *_SECRET values before first run.
# Generate each secret with:  docker run --rm authelia/authelia:latest authelia crypto rand --length 64
theme: dark

server:
  address: "tcp://0.0.0.0:9091"

log:
  level: info

totp:
  issuer: YOURNAME.duckdns.org

identity_validation:
  reset_password:
    jwt_secret: REPLACE_WITH_RANDOM_SECRET_1

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    # Require username + password + 2FA (TOTP) for the whole dashboard.
    - domain: YOURNAME.duckdns.org
      policy: two_factor

session:
  secret: REPLACE_WITH_RANDOM_SECRET_2
  cookies:
    - name: authelia_session
      domain: YOURNAME.duckdns.org
      authelia_url: https://YOURNAME.duckdns.org/authelia
      expiration: 1h
      inactivity: 5m

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: REPLACE_WITH_RANDOM_SECRET_3
  local:
    path: /config/db.sqlite3

notifier:
  # Dev-friendly: 2FA registration links are written to this file. For real email
  # delivery, swap this for an SMTP notifier later.
  filesystem:
    filename: /config/notification.txt

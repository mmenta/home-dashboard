# Authelia login portal. Protected sites redirect here via SWAG's
# authelia-location.conf; Authelia sends users back after login.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.experimenta.cc;
    include /config/nginx/ssl.conf;
    include /config/nginx/no-crawl.conf;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        include /config/nginx/no-crawl.conf;
        set $upstream_app authelia;
        set $upstream_port 9091;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

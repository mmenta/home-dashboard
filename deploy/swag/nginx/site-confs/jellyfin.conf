# jellyfin.experimenta.cc -> Jellyfin running on unraid's own Docker (192.168.68.55:8096),
# not on the VM. Unraid is on the same LAN, so SWAG reaches it by IP.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jellyfin.experimenta.cc;
    include /config/nginx/ssl.conf;
    include /config/nginx/no-crawl.conf;
    client_max_body_size 0;

    location = /robots.txt {
        include /config/nginx/no-crawl.conf;
        default_type text/plain;
        return 200 "User-agent: *
Disallow: /
";
    }

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/no-crawl.conf;
        set $upstream_app 192.168.68.55;
        set $upstream_port 8096;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}

# www.experimenta.cc -> apex (the heartbeat checks www; without this it would hit the 444 catch-all)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.experimenta.cc;
    include /config/nginx/ssl.conf;
    include /config/nginx/no-crawl.conf;
    return 301 https://experimenta.cc$request_uri;
}
